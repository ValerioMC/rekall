<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task tab with a terminal key</title>
<link rel="stylesheet" href="../redesign/shared.css">
<style>
  html, body { height: auto; }
  body { overflow: auto; padding: 24px; }
  main { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  h1 { font-size: var(--t-heading); font-weight: 500; }
  h2 { font-size: var(--t-title); font-weight: 600; margin-bottom: 10px; }
  p { color: var(--muted); max-width: 72ch; margin-top: 6px; }
  .frame { border: 1px solid var(--border-strong); border-radius: var(--r-card); overflow: hidden; background: var(--canvas); }

  /* the working-set bar, at the console's own sizes */
  .projects { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .company { padding: 0 8px 0 0; font-size: var(--t-caption); color: var(--subtle); }
  .project { position: relative; height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 7px; border-radius: var(--r-control); background: var(--canvas); box-shadow: inset 0 0 0 1px var(--border-strong); font-weight: 500; }
  .project::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -5px; height: 2px; border-radius: 2px; background: var(--accent); }
  .project i { width: 20px; height: 20px; border-radius: var(--r-control); background: #46c9b0; color: var(--canvas); display: grid; place-items: center; font: 600 var(--t-micro) var(--font-sans); }
  .project small { font-size: var(--t-caption); color: var(--subtle); }

  .tasks { height: 38px; display: flex; align-items: stretch; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); }
  .all { display: flex; align-items: center; gap: 8px; padding: 0 14px 0 10px; font-weight: 500; color: var(--muted); }
  .all small { font-size: var(--t-caption); color: var(--subtle); }
  .sep { width: 1px; margin: 10px 6px; background: var(--border); }

  /* one tab: the whole box hovers and carries the gold rule, its buttons are siblings */
  .tab-box { position: relative; display: flex; flex: none; max-width: 250px; color: var(--muted); transition: background-color 140ms, color 140ms; }
  .tab-box.has-key { max-width: 278px; }
  .tab-box:hover, .tab-box.is-hover { background: var(--surface); color: var(--text); }
  .tab-box.current { color: var(--text); }
  .tab-box.current::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

  .term { align-self: center; flex: none; width: 22px; height: 22px; margin-left: 6px; display: grid; place-items: center; border-radius: var(--r-key); color: var(--muted); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgb(0 0 0 / .5); transition: background-color 140ms, color 140ms, box-shadow 140ms, transform 80ms; }
  .term:hover, .term.is-hover { color: var(--text); background: var(--hover); box-shadow: inset 0 0 0 1px var(--border-strong), 0 1px 2px rgb(0 0 0 / .5); }
  .term:active { transform: translateY(1px); }
  .term:focus-visible, .term.is-focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .term[aria-pressed="true"] { color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); cursor: default; }
  .term svg { width: 14px; height: 14px; }

  .tab-btn { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 28px 0 12px; white-space: nowrap; color: inherit; }
  .has-key .tab-btn { padding-left: 8px; }
  .marks { display: flex; align-items: center; gap: 6px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dot.todo { background: var(--anchor); }
  .bars { display: flex; align-items: flex-end; gap: 2px; width: 10px; height: 12px; }
  .bars b { width: 2px; border-radius: 1px; background: var(--session); height: 6px; }
  .bars b:nth-child(2) { height: 12px; } .bars b:nth-child(3) { height: 8px; }
  .bars.off b { background: var(--border-strong); height: 4px; }
  .code { flex: none; font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .title { overflow: hidden; text-overflow: ellipsis; }
  .tally { flex: none; font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .close { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; display: grid; place-items: center; border-radius: var(--r-key); color: var(--subtle); opacity: 0; transition: opacity 140ms; }
  .tab-box:hover .close, .is-hover .close, .current .close, .close:focus-visible { opacity: 1; }
  .close:hover { background: var(--hover); color: var(--text); }
  .close svg { width: 10px; height: 10px; }
  .plus { align-self: center; margin-left: 4px; width: 26px; height: 26px; display: grid; place-items: center; color: var(--subtle); }

  /* the area under the bar: a stand-in, nothing in it is being redesigned */
  .page { height: 150px; padding: 18px 24px; }
  .page.terminal { background: #0b0b0d; font: 400 var(--t-small)/1.7 var(--font-mono); color: var(--muted); }
  .page h3 { font-size: var(--t-heading); font-weight: 500; }

  .states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .state { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .state .tasks { padding: 0 12px; }
  .state figcaption { padding: 9px 12px 11px; font-size: var(--t-small); color: var(--muted); }
  .state figcaption b { display: block; font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Task tab with a terminal key</h1>
    <p>RK-12 has a live terminal session, RK-14 has none. Press the key on RK-12 to show its terminal, press a tab to go back to a task page.</p>
  </header>

  <section>
    <h2 id="where">RK-14's task page</h2>
    <div class="frame">
      <div class="projects"><span class="company">Northwind</span><span class="project"><i>R</i>Rekall <small>2</small></span></div>
      <div class="tasks" id="live" role="tablist"></div>
      <div class="page" id="page"></div>
    </div>
  </section>

  <section>
    <h2>The tab in each state</h2>
    <div class="states" id="states"></div>
  </section>

  <section>
    <h2>Today, for comparison</h2>
    <div class="state"><div class="tasks" id="today"></div></div>
  </section>
</main>

<script>
const ICON_TERM = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 4l3 3-3 3M7.5 10.5H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const RK12 = { code: 'RK-12', title: 'Export the weekly report', tally: '3/7', dot: '', bars: '' };
const RK14 = { code: 'RK-14', title: 'Retry a failed sync', tally: '0/4', dot: 'todo', bars: 'off' };

function tab(task, o = {}) {
  const key = o.key ? `<button class="term ${o.keyState || ''}" aria-pressed="${!!o.pressed}" aria-label="Open the terminal of ${task.code}" title="Open the terminal of ${task.code}" data-term="${task.code}">${ICON_TERM}</button>` : '';
  const bars = o.key ? '' : task.bars;
  return `<div class="tab-box ${o.key ? 'has-key' : ''} ${o.current ? 'current' : ''} ${o.hover ? 'is-hover' : ''}">${key}
    <button class="tab-btn" role="tab" aria-selected="${!!o.current}" data-tab="${task.code}">
      <span class="marks"><span class="dot ${task.dot}"></span><span class="bars ${bars}"><b></b><b></b><b></b></span></span>
      <span class="code">${task.code}</span><span class="title">${task.title}</span><span class="tally">${task.tally}</span>
    </button><button class="close" aria-label="Close ${task.code}">${ICON_CLOSE}</button></div>`;
}

const list = '<span class="all">All tasks <small>9</small></span><span class="sep"></span>';
const plus = '<span class="plus">+</span>';
let view = { task: 'RK-14', terminal: false };

function draw() {
  const live = document.getElementById('live');
  live.innerHTML = list
    + tab(RK12, { key: true, current: view.task === 'RK-12', pressed: view.terminal })
    + tab(RK14, { current: view.task === 'RK-14' }) + plus;
  const task = view.task === 'RK-12' ? RK12 : RK14;
  document.getElementById('where').textContent = view.terminal ? "RK-12's terminal" : `${task.code}'s task page`;
  const page = document.getElementById('page');
  page.className = view.terminal ? 'page terminal' : 'page';
  page.innerHTML = view.terminal
    ? '&rsaquo; /rk task:RK-12<br>Loaded RK-12: 4 steps open.<br>&rsaquo; &#9615;'
    : `<h3>${task.title}</h3><p>The task page of ${task.code}.</p>`;
  live.querySelectorAll('[data-term]').forEach((b) => b.onclick = () => { view = { task: 'RK-12', terminal: true }; draw(); });
  live.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { view = { task: b.dataset.tab, terminal: false }; draw(); });
}
draw();

const states = [
  ['No terminal session', 'No key. The tab is today\'s.', {}],
  ['Rest', 'A raised key before the status marks and the code.', { key: true }],
  ['Hover on the key', 'Only the key brightens further than the tab.', { key: true, hover: true, keyState: 'is-hover' }],
  ['Keyboard focus', 'The amber outline of every control. Tab reaches the key, then the tab.', { key: true, keyState: 'is-focus' }],
  ['Task page open', 'The tab carries the gold rule, the key stays up.', { key: true, current: true }],
  ['Terminal on screen', 'Pressed: the key lights gold. A second press does nothing.', { key: true, current: true, pressed: true }]
];
document.getElementById('states').innerHTML = states.map(([name, note, o]) =>
  `<figure class="state"><div class="tasks">${tab(o.key ? RK12 : RK14, o)}</div><figcaption><b>${name}</b>${note}</figcaption></figure>`).join('');
document.getElementById('today').innerHTML = list + tab(RK12) + tab(RK14, { current: true }) + plus;
</script>
</body>
</html>
