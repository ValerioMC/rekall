<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekall redesign C: Board</title>
<link rel="stylesheet" href="shared.css">
<style>
  .app { height: 100%; display: grid; grid-template-rows: 48px 1fr; }
  .page { min-height: 0; display: grid; grid-template-rows: auto 1fr; padding: 0 24px; }
  .bar1 { display: flex; align-items: center; gap: 12px; padding: 18px 0 16px; }
  .bar1 h1 { font-size: var(--t-heading); font-weight: 500; margin-right: 4px; }
  .scope { height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--border-field); border-radius: var(--r-control); background: var(--surface); display: inline-flex; align-items: center; gap: 10px; font-size: var(--t-body); }
  .scope .c { font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .field { height: 32px; width: 240px; border: 1px solid var(--border-field); border-radius: var(--r-control); background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--subtle); font-size: var(--t-small); }
  .field input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; outline: none; min-width: 0; }
  .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-control); overflow: hidden; background: var(--surface); }
  .seg button { height: 30px; padding: 0 11px; font-size: var(--t-small); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .projs { display: flex; gap: 4px; align-items: center; }
  .pf { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 5px; border-radius: 15px; border: 1px solid var(--border); color: var(--muted); font-size: var(--t-small); }
  .pf.on { border-color: var(--border-strong); background: var(--raised); color: var(--text); }

  .lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 150px; gap: 16px; min-height: 0; padding-bottom: 20px; }
  .lane { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .lane-h { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 12px 0 14px; font-weight: 500; font-size: var(--t-body); }
  .lane-h .n { font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .lane-h .n.hot { color: var(--accent); }
  .lane-h .sp { flex: 1; }
  .lane.review { border-color: #eaa43c55; background: linear-gradient(#eaa43c0d, var(--surface) 140px); }
  .cards { overflow: auto; padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .card { display: grid; gap: 10px; padding: 12px 13px 11px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); cursor: pointer; text-align: left; transition: border-color .14s, transform .22s var(--ease); }
  .card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card .top2 { display: flex; align-items: center; gap: 8px; font-size: var(--t-caption); color: var(--muted); }
  .card .top2 .sp { flex: 1; }
  .card h3 { font-size: var(--t-body); font-weight: 500; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  .card .foot { display: flex; align-items: center; gap: 12px; font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .card .foot .need { color: var(--accent-strong); font-family: var(--font-sans); font-weight: 500; font-size: var(--t-small); }
  .card .segbar { height: 5px; }
  .filed { background: var(--canvas); border-style: dashed; border-color: var(--filed-line); }
  .filed .lane-h { color: var(--filed); }
  .filed p { padding: 4px 14px; color: var(--muted); font-size: var(--t-small); line-height: 1.5; }
  .filed .big { font: 300 28px var(--font-sans); color: var(--filed); padding: 8px 14px 0; }

  /* the sheet: one task, on demand */
  .scrim { position: fixed; inset: 48px 0 0 0; background: #0d1017b8; z-index: 4; opacity: 1; transition: opacity .2s; }
  .scrim.off { opacity: 0; pointer-events: none; }
  .sheet { position: fixed; top: 48px; right: 0; bottom: 0; width: 600px; background: var(--canvas); border-left: 1px solid var(--border-strong); z-index: 5; display: flex; flex-direction: column; box-shadow: -24px 0 60px #0009; transform: none; transition: transform .32s var(--ease); }
  .sheet.off { transform: translateX(100%); }
  .sh-h { padding: 18px 24px 0; border-bottom: 1px solid var(--border); }
  .sh-h .row1 { display: flex; align-items: center; gap: 8px; font-size: var(--t-small); color: var(--muted); }
  .sh-h .row1 .sp { flex: 1; }
  .sh-h h2 { font-size: var(--t-heading); font-weight: 500; margin: 10px 0 10px; line-height: 1.3; text-wrap: balance; }
  .sh-h .meta { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; font-size: var(--t-small); color: var(--muted); }
  .tabs { display: flex; gap: 2px; }
  .tabs button { position: relative; padding: 8px 12px 10px; color: var(--muted); display: flex; gap: 7px; }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); }
  .tabs .n { font: 400 var(--t-caption) var(--font-mono); color: var(--subtle); }
  .sh-b { overflow: auto; padding: 18px 24px 24px; flex: 1; }
  .sh-b p.sum { margin: 8px 0 16px; font-size: var(--t-small); color: var(--muted); }
  .sh-b p.sum b { color: var(--accent-strong); font-weight: 500; }
  .irow { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); font-size: var(--t-body); }
  .irow .w { color: var(--subtle); font-size: var(--t-caption); margin-top: 2px; }
  .irow .ac { display: flex; gap: 6px; margin-top: 10px; }
  .sh-f { display: flex; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--surface); }
</style>
</head>
<body>
<div class="app">
  <div id="top"></div>
  <div class="page">
    <div class="bar1">
      <h1>Work</h1>
      <button class="scope">All work <span class="c">344 tasks</span><span id="sc"></span></button>
      <div class="projs" id="projs"></div>
      <span class="sp"></span>
      <div class="field"><span id="fi"></span><input placeholder="Filter by title or anchor" aria-label="Filter"></div>
      <div class="seg" role="group" aria-label="View"><button><span id="v1"></span>Ledger</button><button class="on"><span id="v2"></span>Board</button></div>
      <button class="btn primary"><span id="pl"></span>New task</button>
    </div>
    <div class="lanes" id="lanes"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Task">
  <div class="sh-h">
    <div class="row1"><span class="avatar sm" style="background:#e263b0">S</span><span>ESA / STVW</span><span class="sp"></span>
      <button class="btn quiet sm" id="aspage">Open as page</button><button class="ibtn" id="x" aria-label="Close"></button></div>
    <h2>check metricbridge integration situation</h2>
    <div class="meta"><span class="pill review">Awaiting review</span><span class="anchor">/rk project:stvv task:check-metricbridge-… <span id="cp"></span></span><span class="sp" style="flex:1"></span><span>5h · 731k tokens</span></div>
    <div class="tabs"><button class="on">Plan <span class="n" style="color:var(--accent)">24</span></button><button>Wrapup</button><button>Notes <span class="n">6</span></button><button>Description</button><button>Time</button></div>
  </div>
  <div class="sh-b">
    <div id="bar"></div>
    <p class="sum"><b>23 claimed steps wait for you.</b> 1 of 24 done.</p>
    <div id="srows"></div>
    <p style="margin-top:12px;color:var(--muted);font-size:var(--t-small)">20 more claimed steps</p>
  </div>
  <div class="sh-f"><button class="btn primary" id="rs"></button><button class="btn" id="tm"></button></div>
</aside>

<script src="shared.js"></script>
<script>
  document.getElementById('top').outerHTML = topbar('Console')
  ;[['sc', 'chevron', 14], ['fi', 'search', 15], ['v1', 'list', 15], ['v2', 'board', 15], ['pl', 'plus', 14], ['x', 'close', 16], ['cp', 'copy', 13]].forEach(([id, n, s]) => (document.getElementById(id).innerHTML = icon(n, s)))
  document.getElementById('rs').innerHTML = icon('play', 12) + 'Resume session'
  document.getElementById('tm').innerHTML = icon('terminal', 14) + 'Open in terminal'
  document.getElementById('bar').innerHTML = segs(1, 23, 24)

  document.getElementById('projs').innerHTML = `<span class="pf on"><span class="avatar sm" style="background:var(--muted)">·</span>All</span>` +
    PROJECTS.map((p) => `<span class="pf"><span class="avatar sm" style="background:${p.hue}">${p.initial}</span>${p.name}</span>`).join('')

  const EXTRA = [
    { p: 'cos', title: 'AIRA for XMM: development and deployment environment on c3h', status: 'todo', steps: [0, 0], notes: 0, tokens: '0', ago: '6d' },
    { p: 'cos', title: 'AIRA for XMM: ingest XMM data and run similarity searches', status: 'todo', steps: [0, 0], notes: 0, tokens: '0', ago: '6d' },
    { p: 'stv', title: 'Checkout all the projects', status: 'todo', steps: [0, 0], notes: 0, tokens: '32.9k', ago: '7d' },
    { p: 'cos', title: 'Data connector: one access layer to the operations data', status: 'todo', steps: [0, 0], notes: 0, tokens: '0', ago: '9d' }
  ]
  const all = TASKS.concat(EXTRA)
  const lanes = [
    { name: 'To do', n: 35, list: all.filter((t) => t.status === 'todo') },
    { name: 'In progress', n: 39, list: all.filter((t) => t.status === 'prog') },
    { name: 'Awaiting your review', n: 38, hot: true, cls: 'review', list: all.filter((t) => t.review) }
  ]
  function card(t) {
    const p = projectById(t.p)
    const plan = t.steps[1] ? segs(t.steps[0], t.claimed || 0, Math.min(t.steps[1], 24)) : ''
    const foot = [
      t.review ? `<span class="need">${t.claimed ? t.claimed + ' to review' : 'Review'}</span>` : '',
      t.steps[1] ? `<span>${t.steps[0]}/${t.steps[1]}</span>` : '',
      t.notes ? `<span>${t.notes} notes</span>` : '',
      t.tokens !== '0' ? `<span>${t.tokens}</span>` : ''
    ].filter(Boolean).join('')
    return `<button class="card ${t.selected ? 'sel' : ''}" data-sel="${t.selected ? 1 : 0}">
      <span class="top2"><span class="avatar sm" style="background:${p.hue}">${p.initial}</span><span class="trunc">${p.name}</span><span class="sp"></span><span>${t.ago}</span></span>
      <h3>${t.title}</h3>${plan}<span class="foot">${foot}</span></button>`
  }
  document.getElementById('lanes').innerHTML = lanes.map((l) => `<section class="lane ${l.cls || ''}"><div class="lane-h">${mk(l.name === 'To do' ? 'todo' : l.hot ? 'claimed' : 'prog')}${l.name}<span class="n ${l.hot ? 'hot' : ''}">${l.n}</span><span class="sp"></span><button class="ibtn" aria-label="Add to ${l.name}">${icon('plus', 15)}</button></div><div class="cards">${l.list.map(card).join('')}</div></section>`).join('') +
    `<section class="lane filed"><div class="lane-h">${mk('filed')}Filed</div><div class="big num">269</div><p>Finished tasks stay out of the way. Open the shelf to read or reopen one.</p></section>`

  const sr = STEPS.slice(1, 4)
  document.getElementById('srows').innerHTML = sr.map((s) => `<div class="irow">${mk('claimed')}<div><div>${s.t}</div><div class="w">claimed ${s.ago}</div><div class="ac"><button class="btn sm">Send back</button><button class="btn sm primary">Accept</button></div></div></div>`).join('')

  const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim')
  const set = (open) => { sheet.classList.toggle('off', !open); scrim.classList.toggle('off', !open) }
  document.getElementById('lanes').addEventListener('click', (e) => { if (e.target.closest('.card')) set(true) })
  document.getElementById('x').onclick = () => set(false)
  scrim.onclick = () => set(false)
  addEventListener('keydown', (e) => e.key === 'Escape' && set(false))
  document.getElementById('aspage').onclick = () => (location.href = 'a-desk.html')
  if (location.hash !== '#open') set(false)
</script>
</body>
</html>
