[package]
name = "rekall-service"
description = "Context assembly, the step and review lines, wrapups, revisions, time entries, search and commits"
version.workspace = true
edition.workspace = true

[dependencies]
rekall-common.workspace = true
rekall-model.workspace = true
rekall-repository.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
regex.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Integration suites live in tests/integration and unit tests in tests/unit, so Cargo discovers
# neither by itself: each suite is declared here, and a suite left out of this list never runs.

[[test]]
name = "git"
path = "tests/integration/git.rs"

[[test]]
name = "services"
path = "tests/integration/services.rs"
