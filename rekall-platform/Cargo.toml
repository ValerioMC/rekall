[package]
name = "rekall-platform"
description = "The database registry, backups, restart handle and release check the application runs around the catalog"
version.workspace = true
edition.workspace = true

[dependencies]
rekall-common.workspace = true
rekall-repository.workspace = true
rekall-service.workspace = true
rekall-web.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
chrono.workspace = true
regex.workspace = true
zip.workspace = true
tempfile.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest.workspace = true
keyring.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# keyring reaches no real store without a backend feature, so each platform turns on its own.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[dev-dependencies]
tempfile.workspace = true
