databaseChangeLog:
  - changeSet:
      id: 009-task-step
      author: rekall
      changes:
        - createTable:
            tableName: task_step
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_task_step, nullable: false}}
              - column: {name: task_id, type: uuid, constraints: {nullable: false}}
              - column: {name: title, type: varchar(200), constraints: {nullable: false}}
              - column: {name: body_markdown, type: varchar(20000)}
              - column: {name: done, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: done_at, type: timestamp}
              - column: {name: position, type: int, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: task_step
            baseColumnNames: task_id
            referencedTableName: task
            referencedColumnNames: id
            constraintName: fk_task_step_task
            onDelete: CASCADE
        - createIndex:
            tableName: task_step
            indexName: idx_task_step_task
            columns:
              - column: {name: task_id}
              - column: {name: position}
