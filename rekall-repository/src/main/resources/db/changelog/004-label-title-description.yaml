databaseChangeLog:
  - changeSet:
      id: 004-project-label-and-title
      author: rekall
      changes:
        - addColumn:
            tableName: project
            columns:
              - column: {name: title, type: varchar(200)}
        - sql:
            sql: UPDATE project SET title = name WHERE title IS NULL
        - addNotNullConstraint:
            tableName: project
            columnName: title
            columnDataType: varchar(200)
        - renameColumn:
            tableName: project
            oldColumnName: name
            newColumnName: label
            columnDataType: varchar(120)
        - sql:
            sql: >
              UPDATE project SET label = REGEXP_REPLACE(
                REGEXP_REPLACE(LOWER(label), '[^a-z0-9._-]+', '-'), '^[._-]+|[._-]+$', '')
        - dropUniqueConstraint:
            tableName: project
            constraintName: uq_project_company_name
        - addUniqueConstraint:
            tableName: project
            columnNames: company_id, label
            constraintName: uq_project_company_label

  - changeSet:
      id: 004-task-label-and-title
      author: rekall
      changes:
        - addColumn:
            tableName: task
            columns:
              - column: {name: title, type: varchar(200)}
        - sql:
            sql: UPDATE task SET title = name WHERE title IS NULL
        - addNotNullConstraint:
            tableName: task
            columnName: title
            columnDataType: varchar(200)
        - renameColumn:
            tableName: task
            oldColumnName: name
            newColumnName: label
            columnDataType: varchar(160)
        - sql:
            sql: >
              UPDATE task SET label = REGEXP_REPLACE(
                REGEXP_REPLACE(LOWER(label), '[^a-z0-9._-]+', '-'), '^[._-]+|[._-]+$', '')
        - dropUniqueConstraint:
            tableName: task
            constraintName: uq_task_project_name
        - addUniqueConstraint:
            tableName: task
            columnNames: project_id, label
            constraintName: uq_task_project_label
