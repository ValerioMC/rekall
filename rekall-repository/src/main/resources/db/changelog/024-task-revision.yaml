databaseChangeLog:
  - changeSet:
      id: 024-task-revision
      author: rekall
      changes:
        - createTable:
            tableName: task_revision
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_task_revision, nullable: false}}
              - column: {name: task_id, type: uuid, constraints: {nullable: false}}
              - column: {name: kind, type: varchar(20), constraints: {nullable: false}}
              - column: {name: body_markdown, type: varchar(100000), constraints: {nullable: false}}
              - column: {name: written_by, type: varchar(20)}
              - column: {name: written_at, type: timestamp}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: task_revision
            baseColumnNames: task_id
            referencedTableName: task
            referencedColumnNames: id
            constraintName: fk_task_revision_task
            onDelete: CASCADE
        - createIndex:
            tableName: task_revision
            indexName: ix_task_revision_task_kind
            columns:
              - column: {name: task_id}
              - column: {name: kind}
              - column: {name: created_at}
