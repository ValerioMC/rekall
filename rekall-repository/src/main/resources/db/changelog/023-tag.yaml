databaseChangeLog:
  - changeSet:
      id: 023-tag
      author: rekall
      changes:
        - createTable:
            tableName: tag
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_tag, nullable: false}}
              - column: {name: name, type: varchar(60), constraints: {nullable: false, unique: true, uniqueConstraintName: uq_tag_name}}
              - column: {name: icon, type: varchar(40), constraints: {nullable: false}}
              - column: {name: color, type: varchar(40), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, constraints: {nullable: false}}
        - addColumn:
            tableName: task
            columns:
              - column: {name: tag_id, type: uuid}
        - addForeignKeyConstraint:
            baseTableName: task
            baseColumnNames: tag_id
            referencedTableName: tag
            referencedColumnNames: id
            constraintName: fk_task_tag
            onDelete: SET NULL
