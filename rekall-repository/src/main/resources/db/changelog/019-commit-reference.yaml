databaseChangeLog:
  - changeSet:
      id: 019-commit-reference
      author: rekall
      changes:
        - createTable:
            tableName: commit_reference
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_commit_reference, nullable: false}}
              - column: {name: task_id, type: uuid, constraints: {nullable: false}}
              - column: {name: step_id, type: uuid}
              - column: {name: commit_hash, type: varchar(40), constraints: {nullable: false}}
              - column: {name: comment, type: varchar(200), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: commit_reference
            baseColumnNames: task_id
            referencedTableName: task
            referencedColumnNames: id
            constraintName: fk_commit_reference_task
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: commit_reference
            baseColumnNames: step_id
            referencedTableName: task_step
            referencedColumnNames: id
            constraintName: fk_commit_reference_step
            onDelete: CASCADE
