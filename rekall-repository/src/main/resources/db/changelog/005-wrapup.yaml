databaseChangeLog:
  - changeSet:
      id: 005-wrapup
      author: rekall
      changes:
        - createTable:
            tableName: wrapup
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_wrapup, nullable: false}}
              - column: {name: task_id, type: uuid, constraints: {nullable: false}}
              - column: {name: body_markdown, type: varchar(20000), constraints: {nullable: false}}
              - column: {name: written_by, type: varchar(20), constraints: {nullable: false}}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: wrapup
            columnNames: task_id
            constraintName: uq_wrapup_task
        - addForeignKeyConstraint:
            baseTableName: wrapup
            baseColumnNames: task_id
            referencedTableName: task
            referencedColumnNames: id
            constraintName: fk_wrapup_task
            onDelete: CASCADE
