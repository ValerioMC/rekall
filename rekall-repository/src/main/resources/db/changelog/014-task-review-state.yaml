databaseChangeLog:
  - changeSet:
      id: 014-task-review-state
      author: rekall
      changes:
        - addColumn:
            tableName: task
            columns:
              - column: {name: review_state, type: varchar(20), defaultValue: 'OPEN', constraints: {nullable: false}}
              - column: {name: claimed_at, type: timestamp}
              - column: {name: accepted_at, type: timestamp}
              - column: {name: review_note, type: varchar(2000)}
