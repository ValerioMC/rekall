databaseChangeLog:
  - changeSet:
      id: 026-run-queue
      author: rekall
      changes:
        - createTable:
            tableName: run_queue
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_run_queue, nullable: false}}
              - column: {name: state, type: varchar(20), constraints: {nullable: false}}
              - column: {name: start_at, type: timestamp}
              - column: {name: ceiling_percent, type: int}
              - column: {name: skip_permissions, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: model, type: varchar(20)}
              - column: {name: effort, type: varchar(20)}
              - column: {name: hold_until, type: timestamp}
              - column: {name: hold_reason, type: varchar(500)}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
              - column: {name: updated_at, type: timestamp, constraints: {nullable: false}}
        - createTable:
            tableName: run_queue_item
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_run_queue_item, nullable: false}}
              - column: {name: task_id, type: uuid, constraints: {nullable: false}}
              - column: {name: position, type: int, constraints: {nullable: false}}
              - column: {name: state, type: varchar(20), constraints: {nullable: false}}
              - column: {name: detail, type: varchar(500)}
              - column: {name: started_at, type: timestamp}
              - column: {name: finished_at, type: timestamp}
              - column: {name: created_at, type: timestamp, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: run_queue_item
            baseColumnNames: task_id
            referencedTableName: task
            referencedColumnNames: id
            constraintName: fk_run_queue_item_task
            onDelete: CASCADE
        - createIndex:
            tableName: run_queue_item
            indexName: ix_run_queue_item_position
            columns:
              - column: {name: position}
