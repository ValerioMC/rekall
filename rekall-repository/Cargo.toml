[package]
name = "rekall-repository"
description = "The SQLite connection, the migrations that build its schema, and the queries the services read with"
version.workspace = true
edition.workspace = true

[dependencies]
rekall-common.workspace = true
rekall-model.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tokio.workspace = true
tracing.workspace = true
regex.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Integration suites live in tests/integration and unit tests in tests/unit, so Cargo discovers
# neither by itself: each suite is declared here, and a suite left out of this list never runs.

[[test]]
name = "migrations"
path = "tests/integration/migrations.rs"
