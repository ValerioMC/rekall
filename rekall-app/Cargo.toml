[package]
name = "rekall-app"
description = "The Rekall server: composes every module into one Axum application, the database registry, backups, local-access guard and the console's static bundle"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rekall-server"
path = "src/main.rs"

[dependencies]
rekall-common.workspace = true
rekall-model.workspace = true
rekall-repository.workspace = true
rekall-service.workspace = true
rekall-api.workspace = true
rekall-mcp.workspace = true
rekall-claude.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
regex.workspace = true
zip.workspace = true
tempfile.workspace = true
dirs.workspace = true
uuid.workspace = true
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
socket2 = { version = "0.5", features = ["all"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["multipart"] }
tokio-tungstenite = "0.29"
async-trait.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Integration suites live in tests/integration and unit tests in tests/unit, so Cargo discovers
# neither by itself: each suite is declared here, and a suite left out of this list never runs.

[[test]]
name = "e2e_catalog"
path = "tests/integration/e2e_catalog.rs"

[[test]]
name = "e2e_commits"
path = "tests/integration/e2e_commits.rs"

[[test]]
name = "e2e_misc"
path = "tests/integration/e2e_misc.rs"

[[test]]
name = "e2e_steps"
path = "tests/integration/e2e_steps.rs"

[[test]]
name = "e2e_wrapup_time"
path = "tests/integration/e2e_wrapup_time.rs"

[[test]]
name = "h2_import"
path = "tests/integration/h2_import.rs"

[[test]]
name = "settings_backups"
path = "tests/integration/settings_backups.rs"

[[test]]
name = "terminal_queue"
path = "tests/integration/terminal_queue.rs"
