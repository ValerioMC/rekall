<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rekall</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #08090c; color: #f2f5f9; overflow: hidden;
      font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, 'Fira Sans', sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .scene { position: fixed; inset: 0; opacity: 0; animation: appear 600ms ease-out forwards; }
    .art {
      position: absolute; inset: 0;
      background: #0b0d11 url('splash_screen.png') center / cover no-repeat;
      transition: opacity 300ms ease-out;
    }
    .failed .art { opacity: 0.18; }
    /* Not drawn over the artwork, whose own motto sits where a visible line would land. */
    .status {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);
      white-space: nowrap;
    }
    .panel {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 2rem;
    }
    .failed .panel { display: flex; }
    .failed .status { display: none; }
    .mark {
      font-size: 0.75rem; letter-spacing: 0.42em; text-transform: uppercase;
      color: #f5a524; margin-bottom: 2rem;
    }
    .title { font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; }
    .detail { color: #a3acba; font-size: 12.5px; margin-top: 0.75rem; max-width: 34rem; }
    .path { font-family: 'Fira Code', ui-monospace, monospace; color: #5fd0e0; font-size: 12px; }
    @keyframes appear { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="art"></div>
    <div class="status" id="status" role="status">Starting…</div>
    <div class="panel" id="panel"></div>
  </div>
  <script>
    // Driven from the shell: the status line while the server starts, and the error page if it
    // does not. Text only, never markup, whatever the shell passes.
    window.rekallStatus = function (text) {
      document.getElementById('status').textContent = text;
    };
    window.rekallFail = function (title, detail, log) {
      var panel = document.getElementById('panel');
      panel.textContent = '';
      var add = function (cls, text) {
        var div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        panel.appendChild(div);
        return div;
      };
      add('mark', 'Rekall');
      add('title', title);
      add('detail', detail);
      var line = add('detail', 'Log: ');
      var path = document.createElement('span');
      path.className = 'path';
      path.textContent = log;
      line.appendChild(path);
      add('detail', 'View › Reload tries again.');
      document.getElementById('scene').classList.add('failed');
    };
  </script>
</body>
</html>
