spring:
  application:
    name: rekall

  datasource:
    # H2 on file, next to wherever you start it. AUTO_SERVER lets a second process (a SQL
    # client, a backup script) open the same file while the application is running.
    url: ${REKALL_DB_URL:jdbc:h2:file:./data/rekall;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${REKALL_DB_USER:rekall}
    password: ${REKALL_DB_PASSWORD:rekall}
    hikari:
      pool-name: rekall-app
      maximum-pool-size: 10

  jpa:
    # The schema belongs to Liquibase. A drift between the changelogs and the entities must
    # stop the application, not be silently patched at runtime.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    dev.rekall: INFO
    liquibase: WARN
