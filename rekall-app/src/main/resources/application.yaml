spring:
  application:
    name: rekall

  datasource:
    # AUTO_SERVER lets a second process (a SQL client, a backup script) open the same file
    # while the application is running. The path itself is not hardcoded here: it comes from
    # rekall.resolved-db-url, computed by DatabaseLocationEnvironmentPostProcessor from
    # ~/.rekall/config.json before this file is even read, so an explicit REKALL_DB_URL still
    # overrides everything for anyone who sets it by hand.
    url: ${REKALL_DB_URL:${rekall.resolved-db-url}}
    username: ${REKALL_DB_USER:rekall}
    password: ${REKALL_DB_PASSWORD:rekall}
    hikari:
      pool-name: rekall-app
      maximum-pool-size: 10

  jpa:
    # The schema belongs to Liquibase. A drift between the changelogs and the entities must
    # stop the application, not be silently patched at runtime.
    hibernate:
      ddl-auto: validate
    # GraalVM native image can't run ByteBuddy's runtime bytecode generation (used by the
    # default provider for fast entity instantiation and lazy-loading proxies). "none" avoids
    # it; the lazy @ManyToOne/@OneToOne fields rely instead on build-time enhancement, see the
    # hibernate-maven-plugin enhance execution in rekall-domain/pom.xml.
    properties:
      hibernate:
        bytecode:
          provider: none
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # Not 8080. Rekall runs all day on a developer machine, where 8080 is the first port
  # anything else takes, and the MCP endpoint is registered with Claude Code as a fixed
  # URL: a clash is not a retry, it is a broken registration. 47355 is unassigned by IANA,
  # absent from /etc/services, and below the ephemeral range (49152+) macOS hands out to
  # outbound sockets, so nothing takes it by accident. Changing it means changing
  # Server.port in packaging/macos/Launcher.swift, the vite proxy and `make mcp-add` too.
  port: ${SERVER_PORT:47355}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    dev.rekall: INFO
    liquibase: WARN
