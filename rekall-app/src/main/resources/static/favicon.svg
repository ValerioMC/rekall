<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rekall">
  <defs>
    <linearGradient id="rk-tile" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1e2634" />
      <stop offset="0.52" stop-color="#12161d" />
      <stop offset="1" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="rk-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rk-ring" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#ffd08a" />
      <stop offset="0.44" stop-color="#f5a524" />
      <stop offset="1" stop-color="#a8681a" />
    </linearGradient>
    <linearGradient id="rk-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdca4" />
      <stop offset="1" stop-color="#e09a20" />
    </linearGradient>
    <linearGradient id="rk-node" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#c9f2f9" />
      <stop offset="1" stop-color="#4cc3d5" />
    </linearGradient>
    <radialGradient id="rk-glow">
      <stop offset="0.5" stop-color="#5fd0e0" stop-opacity="0.28" />
      <stop offset="1" stop-color="#5fd0e0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#rk-tile)" />
  <rect width="512" height="512" rx="115" fill="url(#rk-sheen)" />
  <rect x="3" y="3" width="506" height="506" rx="112.5" fill="none" stroke="#ffd9a8" stroke-opacity="0.16" stroke-width="6" />

  <!-- The context: everything Rekall holds around one task, open where the anchor enters. -->
  <path d="M362.79 178.41 A132 132 0 1 0 362.79 333.59" fill="none" stroke="url(#rk-ring)" stroke-width="56" stroke-linecap="round" />

  <!-- The record in focus. -->
  <rect x="200" y="200" width="112" height="112" rx="34" fill="url(#rk-core)" />

  <!-- The anchor, in the colour nothing else uses. -->
  <circle cx="388" cy="256" r="76" fill="url(#rk-glow)" />
  <circle cx="388" cy="256" r="38" fill="url(#rk-node)" />
</svg>
