name: Release

# Builds and publishes a versioned release, and only that: a push to main builds nothing.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag has to name a commit already on main; a tag pushed on any other commit fails the run
# before anything is built. GitHub's /releases/latest resolves to the newest release, so a link
# that goes through it always downloads the newest tag:
#   https://github.com/ValerioMC/rekall/releases/latest/download/Rekall-macos-arm64.dmg
#
# Assets:
#   rekall-v0.1.1-linux-x64         the server, console embedded
#   rekall-v0.1.1-windows-x64.exe   the server, console embedded
#   Rekall-macos-arm64.dmg          Rekall.app (Tauri), Apple Silicon
#
# The tag's version (v0.1.1 -> 0.1.1) is compiled into every build as REKALL_VERSION: the console
# shows it after "Rekall" and compares it with this release feed to offer a newer download.
#
# The disk image carries no version in its name, because it is the one asset a link off-site
# points at and a name that moves would defeat that.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      suffix: ${{ steps.target.outputs.suffix }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME names $GITHUB_SHA, which is not on main."
            exit 1
          fi

      # One decision, made once and read by the other jobs, so they cannot disagree about which
      # release they are uploading to.
      - name: Resolve the release this run publishes
        id: target
        run: |
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "suffix=-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rekall-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rekall-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The server embeds rekall-ui/dist at compile time and the bundle is not in the repository,
      # so this step is where the console in the binary comes from.
      - name: Build frontend
        run: |
          cd rekall-ui
          pnpm install --frozen-lockfile
          pnpm build

      # REKALL_VERSION is the version the app shows and compares against the latest release.
      - name: Build server
        run: cargo build --release -p rekall-app
        env:
          REKALL_VERSION: ${{ steps.target.outputs.version }}

      - name: Locate binary
        id: bin
        run: |
          release_name="rekall${{ steps.target.outputs.suffix }}-linux-x64"
          cp target/release/rekall-server "$release_name"
          echo "path=$release_name" >> "$GITHUB_OUTPUT"

      # This is the step that creates the release the other jobs then upload into, which is why
      # they depend on this job rather than running beside it.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.bin.outputs.path }}

  # The same bundle `make dmg` builds locally.
  build-dmg-macos:
    needs: build-and-release
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rekall-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rekall-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build frontend
        run: |
          cd rekall-ui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bundle Rekall.app into a disk image
        working-directory: rekall-app/desktop
        run: cargo tauri build --bundles dmg --config "{\"version\":\"$REKALL_VERSION\"}"
        env:
          REKALL_VERSION: ${{ needs.build-and-release.outputs.version }}

      # The disk image keeps one name on every release, because a link on a web page points at it. The name Tauri writes carries the version and the architecture, so
      # the file is found by pattern rather than by guessing that string.
      - name: Locate disk image
        run: |
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "no disk image under target/release/bundle/dmg" >&2
            exit 1
          fi
          cp "$dmg" "Rekall-macos-arm64.dmg"
          echo "Built $(basename "$dmg") ($(du -h "$dmg" | cut -f1))"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag }}
          files: Rekall-macos-arm64.dmg

  build-windows:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rekall-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rekall-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        shell: bash
        run: |
          cd rekall-ui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server
        run: cargo build --release -p rekall-app
        env:
          REKALL_VERSION: ${{ needs.build-and-release.outputs.version }}

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          release_name="rekall${{ needs.build-and-release.outputs.suffix }}-windows-x64.exe"
          cp target/release/rekall-server.exe "$release_name"
          echo "path=$release_name" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag }}
          files: ${{ steps.bin.outputs.path }}
