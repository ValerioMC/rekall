name: Check

# The gate a change passes before it reaches main: clippy and every crate's tests, the console's
# eslint, vue-tsc and vitest, and a build of the desktop shell, as `make lint test` does locally,
# on every pull request and every push to a branch other than main.
on:
  pull_request:
  push:
    branches-ignore:
      - main

# A newer push to the same branch supersedes the run still going on the older one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rekall-ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rekall-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rekall-ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: vue-tsc
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      # The bundle is what the server embeds; a change that type-checks but does not build fails here.
      - name: Build
        run: pnpm build

  # Every crate's tests. Java and the H2 jar are there only so the legacy H2 import tests run
  # instead of skipping: reading an H2 file needs H2's own jar.
  backend:
    runs-on: ubuntu-latest
    env:
      REKALL_H2_JAR: ${{ github.workspace }}/.h2/h2-2.4.240.jar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: H2 jar for the import tests
        run: curl -sSfL --create-dirs -o "$REKALL_H2_JAR" https://repo1.maven.org/maven2/com/h2database/h2/2.4.240/h2-2.4.240.jar

      - name: clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test

  # The desktop shell only compiles against the platform WebView SDK, so it is not a default
  # workspace member; this checks that it still builds.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: cargo build
        run: cargo build -p rekall-desktop
