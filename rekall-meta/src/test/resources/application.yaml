spring:
  jpa:
    # validate, not update: the meta-model schema is owned by Liquibase, and a mismatch
    # between the changelogs and the JPA entities must fail the build rather than be
    # silently patched at runtime.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    liquibase: WARN
