apiVersion: apps/v1
kind: Deployment
metadata:
  name: rekall
  labels:
    app: rekall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rekall
  template:
    metadata:
      labels:
        app: rekall
    spec:
      containers:
        - name: rekall
          image: rekall:latest
          # Built straight into the minikube daemon, so there is no registry to pull from.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: REKALL_DB_URL
              value: "jdbc:postgresql://postgres:5432/rekall"
            - name: REKALL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: rekall-secrets
                  key: db-user
            - name: REKALL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rekall-secrets
                  key: db-password
            # Liquibase creates the read-only role with this password, and the MCP server
            # authenticates with it. One secret, two consumers, by design.
            - name: REKALL_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rekall-secrets
                  key: reader-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
