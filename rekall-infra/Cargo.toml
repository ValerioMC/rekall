[package]
name = "rekall-infra"
description = "Everything with a process, a file, a socket or outbound HTTP behind it: the Claude Code terminals, usage meter, run queue worker and transcripts, backups, the database registry, the restart handle, the release check, the OS credential store and the HTTP clients"
version.workspace = true
edition.workspace = true

[dependencies]
rekall-kernel.workspace = true
rekall-store.workspace = true
rekall-diagram.workspace = true
rekall-core.workspace = true
rekall-web.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tracing.workspace = true
chrono.workspace = true
regex.workspace = true
base64.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
async-trait.workspace = true
dirs.workspace = true
tempfile.workspace = true
zip.workspace = true
thiserror.workspace = true
keyring.workspace = true
libc = "0.2"

# keyring reaches no real store without a backend feature, so each platform turns on its own.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

# Integration suites live in tests/integration and unit tests in tests/unit, so Cargo discovers
# neither by itself: each suite is declared here, and a suite left out of this list never runs.

[[test]]
name = "run_queue"
path = "tests/integration/run_queue.rs"

[[test]]
name = "credentials"
path = "tests/integration/credentials.rs"

[[test]]
name = "terminal"
path = "tests/integration/terminal.rs"
