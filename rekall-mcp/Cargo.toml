[package]
name = "rekall-mcp"
description = "The /mcp JSON-RPC endpoint: one tool reads, four write a few narrow things"
version.workspace = true
edition.workspace = true

[dependencies]
rekall-common.workspace = true
rekall-model.workspace = true
rekall-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
regex.workspace = true
base64.workspace = true
async-trait.workspace = true

[dev-dependencies]
rekall-repository.workspace = true
tower.workspace = true
http-body-util.workspace = true

# Integration suites live in tests/integration and unit tests in tests/unit, so Cargo discovers
# neither by itself: each suite is declared here, and a suite left out of this list never runs.

[[test]]
name = "protocol"
path = "tests/integration/protocol.rs"
